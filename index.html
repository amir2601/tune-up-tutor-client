<!DOCTYPE html>
<html lang="en" data-theme="tuneup">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Light is the site default; dark is only used if the visitor chose it.
      (function () {
        try {
          var key = 'tuneup-theme';
          var saved = localStorage.getItem(key);
          var theme = saved === 'tuneup' || saved === 'tuneup-dark' ? saved : 'tuneup';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme === 'tuneup-dark' ? 'dark' : 'light';
        } catch (e) { /* ignore */ }
      })();
    </script>
    <meta name="description" content="Tune Up Tutor — learn music with world-class instructors. Book classes in guitar, piano, drums, violin, flute and more." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <title>Tune Up Tutor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
