<!DOCTYPE html>
<html lang="en" data-theme="tuneup">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/src/assets/favicon.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <script>
      // Apply the saved (or preferred) theme before first paint to avoid a flash.
      (function () {
        try {
          var key = 'tuneup-theme';
          var saved = localStorage.getItem(key);
          var theme = saved === 'tuneup' || saved === 'tuneup-dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'tuneup-dark' : 'tuneup');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme === 'tuneup-dark' ? 'dark' : 'light';
        } catch (e) { /* ignore */ }
      })();
    </script>
    <meta name="description" content="TuneUp Tutor — learn music with world-class instructors. Book classes in guitar, piano, drums, violin, flute and more." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <title>Tune-Up Tutor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
